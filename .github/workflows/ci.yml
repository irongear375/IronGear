# ============================================================================
# WristAssist AI — CI Workflow
# SCRUM-50: GitHub Actions CI pipeline
#
# Triggers: Every push/PR to main
# Steps: Lint → Unit tests → Config validation → Docker build
# ============================================================================

name: CI — Lint, Test, Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  DOCKER_IMAGE: "wristassist-ci"

jobs:
  # ────────────────────────────────────────────────────────────
  # Job 1: Lint + Unit Tests
  # ────────────────────────────────────────────────────────────
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true   # Pull best.pt via Git LFS

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install CPU-only PyTorch (avoids 2GB CUDA download)
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # Install app dependencies
          pip install fastapi uvicorn pydantic python-multipart \
                      ultralytics easyocr opencv-python-headless \
                      Pillow numpy pandas pyyaml
          # Install test dependencies
          pip install -r requirements-test.txt

      - name: Lint with flake8
        run: |
          pip install flake8
          # Stop build on syntax errors or undefined names
          flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Warnings only (don't fail) for style issues
          flake8 app/ --count --max-line-length=120 --statistics --exit-zero

      - name: Run unit tests
        env:
          LOG_DIR: /tmp/wristassist_test
          MODEL_PATH: models/best.pt
          MODEL_VERSION: sprint2_yolo11l_expB_v1
        run: |
          mkdir -p /tmp/wristassist_test
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  # ────────────────────────────────────────────────────────────
  # Job 2: Config & Pipeline Validation
  # ────────────────────────────────────────────────────────────
  validate:
    name: Validate Config & Pipeline
    runs-on: ubuntu-latest
    needs: test   # Only run if tests pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: "pip"

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Validate experiment config
        run: |
          python pipeline/pipeline_controller.py \
            --ci \
            --mode validate \
            --config experiment_config.yaml

      - name: Validate data processing (dry run)
        run: |
          python pipeline/data_processing.py \
            --config experiment_config.yaml \
            --dry-run

      - name: Check required files exist
        run: |
          echo "Checking required Sprint 3 files..."
          files=(
            "app/app.py"
            "app/index.html"
            "app/monitoring.py"
            "app/drift.py"
            "app/baseline_distribution.json"
            "models/best.pt"
            "Dockerfile"
            "experiment_config.yaml"
          )
          missing=0
          for f in "${files[@]}"; do
            if [ -f "$f" ]; then
              echo "  ✓ $f"
            else
              echo "  ✗ MISSING: $f"
              missing=$((missing + 1))
            fi
          done
          if [ $missing -gt 0 ]; then
            echo "ERROR: $missing required files missing"
            exit 1
          fi
          echo "All required files present"

  # ────────────────────────────────────────────────────────────
  # Job 3: Docker Build (verify image compiles)
  # ────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [test, validate]   # Only run if tests + validation pass

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        run: |
          docker build \
            --tag ${{ env.DOCKER_IMAGE }}:${{ github.sha }} \
            --tag ${{ env.DOCKER_IMAGE }}:latest \
            .

      - name: Verify image size
        run: |
          SIZE=$(docker image inspect ${{ env.DOCKER_IMAGE }}:latest --format='{{.Size}}')
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Image size: ${SIZE_MB} MB"
          # Warn if over 3GB (HF Spaces has limits)
          if [ $SIZE_MB -gt 3072 ]; then
            echo "WARNING: Image exceeds 3GB target (${SIZE_MB} MB)"
          fi

      - name: Smoke test container
        run: |
          # Start container in background
          docker run -d --name wristassist-test \
            -p 7860:7860 \
            ${{ env.DOCKER_IMAGE }}:latest

          # Wait for startup (model loading takes ~30s)
          echo "Waiting for container startup..."
          sleep 60

          # Health check
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:7860/health || echo "000")
          echo "Health check response: $HTTP_CODE"

          # Show container logs on failure
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Container logs:"
            docker logs wristassist-test
            docker stop wristassist-test
            exit 1
          fi

          echo "Container smoke test passed"
          docker stop wristassist-test
